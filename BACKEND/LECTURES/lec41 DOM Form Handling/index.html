<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px;

        }

        div {
            display: flex;
            justify-content: space-between;
        }

        #btn {
            width: 100px;
            /* text-align: center;
            justify-items: center; */
            align-self: flex-end
        }
        .textarea{
            flex-direction: column;
        }
        .alertRed{
            color:red;
            font-size: larger;
            
        }
    </style>
</head>

<body>
    <form action="" id="form">
        <div class="name">
            <label for="name">Name: </label>
            <input type="text" name="name" id="name" value="PriyaLal">
        </div>
        <div class="email">
            <label for="email">Email: </label>
            <input type="email" name="email" id="email" value="PriyaLal@gmail.com">
        </div>
        <div class="address">
            <label for="address">Address: </label>
            <input type="text" name="address" id="address" value="Vrindavan">
        </div>
        <div class="age">
            <label for="age">Age: </label>
            <input type="number" name="age" id="age" value="18">
        </div>
        <div class="textarea">
            <label for="bio">Bio:</label>
            <textarea name="bio" id="bio" ></textarea>
            <p></p>
        </div>
        <button type="submit" id="btn">Submit Form</button>
    </form>
    <script src="script.js"></script>
    <script src="textarea.js"></script>
</body>

</html>
