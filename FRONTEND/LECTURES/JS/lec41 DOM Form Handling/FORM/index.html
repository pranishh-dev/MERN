<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px;

        }

        div {
            display: flex;
            justify-content: space-between;
        }

        #btn {
            width: 100px;
            /* text-align: center;
            justify-items: center; */
            align-self: flex-end
        }
        .textarea{
            flex-direction: column;
        }
        .alertRed{
            color:red;
            font-size: larger;
            
        }
        .hidden{
            display: none;
        }
    </style>
</head>

<body>
    <form action="" id="form">
        <div class="nameDiv">
            <label for="name">Name: </label>
            <input type="text" name="name" id="name" value="PriyaLal">
        </div>
        <div class="emailDiv">
            <label for="email">Email: </label>
            <input type="email" name="email" id="email" value="PriyaLal@gmail.com">
        </div>
        <div class="passwordDiv">
            <label for="password">Password</label>
            <input type="password" name="password" id="password">
            <p class="hidden" id="password-hint">password must be 8 characters long</p>
        </div>
        <div class="address">
            <label for="address">Address: </label>
            <input type="text" name="address" id="address" value="Vrindavan">
        </div>
        <div class="ageDiv">
            <label for="age">Age: </label>
            <input type="number" name="age" id="age" value="18">
        </div>
        <div class="textareaDiv">
            <label for="bio">Bio:</label>
            <textarea name="bio" id="bio" ></textarea>
            <p></p>
        </div>
        <div class="checkboxDiv">
            <label for="#check-box">choose karle laadle</label>
            <input type="checkbox" name="checkbox" id="Laadliju" value="Laadliju">
            <label for="Laadliju">Laadliju</label>
            <input type="checkbox" name="checkbox" id="Shyamaju" value="Shyamaju">
            <label for="Shyamaju">Shyamaju</label>
        </div>
        <div class="radioDiv">
            <label for="gender">Gender</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
        </div>
        <div class="dropdownDiv">
            <select name="country" id="country">
                <option value="nepal" >Nepal</option>
                <option value="us" >US</option>
                <option value="uk" >UK</option>
            </select>
        </div>
        <button type="submit" id="btn">Submit Form</button>
    </form>
    <script src="..\FORM events\change.js"></script>
    <script src="..\FORM events\textarea.js"></script>
    <script src="..\FORM events\script.js"></script>
    <script src="..\FORM events\focus_blur.js"></script>
</body>

</html>
